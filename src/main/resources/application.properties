server.address=0.0.0.0
server.port=8080

jwt.secret=${JWT_SECRET}
jwt.lifetime=15m

spring.application.name=shop-service
spring.profiles.active=${SPRING_ACTIVE_PROFILE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.hikari.schema=public
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

app.rabbitmq.product.exchange=product.exchange.${spring.profiles.active}
app.rabbitmq.product.routing-key-price-changed=product.price_changed.routing_key.${spring.profiles.active}

app.rabbitmq.dead-letter.exchange=dead_letter.exchange.${spring.profiles.active}
app.rabbitmq.dead-letter.routing-key-error=dead_letter.error.routing_key.${spring.profiles.active}
app.rabbitmq.dead-letter.queue=dead_letter.errors.queue.${spring.profiles.active}

app.rabbitmq.price-history.queue-price-changed=price_history.price_changed.queue.${spring.profiles.active}